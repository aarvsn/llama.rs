[package]
name = "llama-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "OpenAI-compatible HTTP server for the llama.rs inference engine"

[[bin]]
name = "llama-server"
path = "src/main.rs"

[dependencies]
llama-core = { path = "../llama-core", version = "0.1.0" }
llama-runtime = { path = "../llama-runtime", version = "0.1.0" }
llama-tokenizer = { path = "../llama-tokenizer", version = "0.1.0" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tokio-stream = "0.1"

[dev-dependencies]
llama-fixtures = { path = "../llama-fixtures" }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
